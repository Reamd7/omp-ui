# Lefthook git hooks 配置
# 文档: https://github.com/evilmartians/lefthook
# 由根 package.json 的 "prepare": "lefthook install" 自动安装到 .git/hooks/
#
# 设计原则：
#   1. 并行跑（parallel: true）—— 几个检查互不依赖
#   2. 增量触发（glob）—— 只在相关文件被改动时才跑对应检查
#   3. 治本不治标 —— 每条规则都对应一个历史踩坑（见 .omp/memory-lint-report.md）
#   4. 分层 —— typecheck / oxlint / format 是 pre-commit；commitlint 是 commit-msg
#   5. 跨 workspace —— biz-components 依赖 components，所以只要任一包 src 改了，
#      typecheck/knip 都会全 workspace 跑（pnpm -r + knip workspace scan）

pre-commit:
  parallel: true
  commands:
    # 🥇 Top-1: tsc --noEmit（pnpm -r 跑所有 workspace 的 typecheck）
    # 覆盖 P4（@storybook/react 路径）/ P5（tsconfig baseUrl）/ P6（@/components/ui/X 错 alias）
    typecheck:
      glob: '{components,biz-components}/**/*.{ts,tsx}'
      run: pnpm -r run typecheck

    # 🥈 Top-2: P1 invariant —— 专防 Storybook "React is not defined" 全员崩
    # 脚本自动扫描所有 workspace 的 .storybook/main.ts
    storybook-runtime:
      glob: '{components,biz-components}/.storybook/main.ts'
      run: pnpm check:storybook-runtime

    # 🥉 Top-3a: P7 —— 禁止 openchamber 自定义类 .typography-* 残留
    # 脚本自动扫描所有 workspace 的 src/
    typography-leak:
      glob: '{components,biz-components}/src/**/*.{ts,tsx,css}'
      run: pnpm check:no-typography

    # 🥉 Top-3b: P9 + P10 —— 业务无关层（src/ui/ + src/biz/）禁止业务耦合
    # components/src/ui/ = shadcn 原子；biz-components/src/biz/ = 组合业务组件
    # 都禁：i18n / store / sync / hooks / desktop / Icon / useUIStore 等
    ui-purity:
      glob: '{components,biz-components}/src/{ui,biz}/**/*.{ts,tsx}'
      run: pnpm check:ui-purity

    # oxlint —— P4/P6/P9/P10 的代码侧反馈 + 通用代码质量
    # 比 tsc 快得多（Rust 实现，~1s），先跑 oxlint 立即反馈 import / 未用变量等问题
    oxlint:
      glob: '{components,biz-components}/**/*.{ts,tsx}'
      run: pnpm exec oxlint {staged_files}

    # oxfmt —— 检查格式（不自动修复，pre-commit 只 fail；本地跑 `pnpm format` 修）
    # 跑在两个包的整个目录（oxfmt 对单文件 --check 不稳），~0.7s
    format:
      glob: '{components,biz-components}/**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}'
      run: pnpm format:check

    # knip —— 检测未使用的导出 / 文件 / 依赖。全项目扫描（~1.7s），只在 src 或 package.json 改动时触发
    knip:
      glob: '{components,biz-components}/{src/**,package.json},package.json,pnpm-workspace.yaml,knip.json'
      run: pnpm knip

commit-msg:
  commands:
    # Conventional Commits —— feat/fix/docs/style/refactor/perf/test/build/ci/chore/revert
    commitlint:
      run: pnpm exec commitlint --edit {1}
